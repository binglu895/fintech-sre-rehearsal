# Phase 2 压测:给 Bank of Anthos 关键服务加 HPA(CPU 触发 Pod 水平扩容)。
# 负载上来 → HPA 扩 Pod → 节点不够 → cluster autoscaler 扩节点(max 见 tfvars)。
# 用法:kubectl apply -f k8s/phase2-hpa.yaml
#       删除:kubectl delete -f k8s/phase2-hpa.yaml
# 前置:GKE 有 metrics-server(默认开);BoA 各 Deployment 有 CPU requests(BoA 自带)。
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
