on:
  workflow_call:
    inputs:
      layer_dir: { required: true, type: string }

permissions:
  id-token: write
  contents: read

jobs:
  # ── Job 1:认证 + plan + OPA 门禁 + Checkov,产出 plan 文件 ──
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.layer_dir }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3

      - name: 安装 conftest
        run: |
          CONFTEST_VERSION=0.68.2
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin conftest
          conftest --version
        working-directory: ${{ github.workspace }}

      - run: terraform init
      - run: terraform plan -out=plan.tfout
      - run: terraform show -json plan.tfout > plan.json

      - name: OPA 门禁(deny 阻断 / warn 仅提示)
        run: conftest test plan.json -p ${{ github.workspace }}/policies --output table

      - name: Checkov 兜底扫描(soft 不阻断)
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.layer_dir }}
          framework: terraform
          soft_fail: true
          output_format: cli

      # 把 plan 二进制产物存起来,传给 apply job(保证 apply 的正是审过的 plan)
      - name: 上传 plan 产物
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.layer_dir }}
          path: ${{ inputs.layer_dir }}/plan.tfout
          retention-days: 1

  # ── Job 2:apply,绑定审批环境 → 执行前暂停等人工 Approve ──
  apply:
    needs: plan
    # 仅合并进 main 后才 apply;PR 阶段只到 plan/OPA
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production-apply   # ← 该环境配 Required reviewers,apply 前会暂停等审批
    defaults:
      run:
        working-directory: ${{ inputs.layer_dir }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3

      # 取回 plan job 生成的 plan 文件,apply 的正是被审过的那份
      - name: 下载 plan 产物
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.layer_dir }}
          path: ${{ inputs.layer_dir }}

      - run: terraform init
      - name: Apply(审批通过后执行)
        run: terraform apply -auto-approve plan.tfout
