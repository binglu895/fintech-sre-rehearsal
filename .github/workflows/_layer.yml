on:
  workflow_call:
    inputs:
      layer_dir: { required: true, type: string }

permissions:
  id-token: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.layer_dir }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3

      - name: 安装 conftest
        run: |
          CONFTEST_VERSION=0.68.2
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin conftest
          conftest --version
        working-directory: ${{ github.workspace }}

      - run: terraform init
      - run: terraform plan -out=plan.tfout
      - run: terraform show -json plan.tfout > plan.json

      - name: OPA 门禁
        run: conftest test plan.json -p ${{ github.workspace }}/policies

      - name: Apply(仅 main 分支合并后)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve plan.tfout