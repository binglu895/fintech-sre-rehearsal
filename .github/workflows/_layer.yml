on:
  workflow_call:
    inputs:
      layer_dir: { required: true, type: string }

permissions:
  id-token: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.layer_dir }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3

      - name: 安装 conftest
        run: |
          CONFTEST_VERSION=0.68.2
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin conftest
          conftest --version
        working-directory: ${{ github.workspace }}

      - run: terraform init
      - run: terraform plan -out=plan.tfout
      - run: terraform show -json plan.tfout > plan.json

      - name: OPA 门禁(deny 阻断 / warn 仅提示)
        # conftest 默认:deny 违规 → 失败退出;warn 违规 → 仅显示不失败。
        # 故一条命令即实现分级:硬红线阻断合并,建议项只提示。
        run: conftest test plan.json -p ${{ github.workspace }}/policies --output table

      - name: Checkov 兜底扫描(通用基线,soft 不阻断)
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.layer_dir }}
          framework: terraform
          soft_fail: true
          output_format: cli

      - name: Apply(仅 main 分支合并后)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve plan.tfout
