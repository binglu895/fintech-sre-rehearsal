name: gcp-fintech-iac

# ─────────────────────────────────────────────────────────────
# 分支 → 环境 晋升模型(Trunk-based 变体):
#   push develop      → 部署 Dev(沙箱,自动,OPA 宽松)
#   pull_request→main → 对 Test + Prod 两套配置跑 plan/OPA(只验证不部署)
#   push main         → 部署 Test(自动,轻量审批)→ 通过后 部署 Prod(严格审批)
#
# 手动重建(workflow_dispatch):
#   Actions → Run workflow → 选 env(dev/test/prod)→ 强制重建该环境全部层,
#   无需改文件、无需翻旧运行。销毁后重建 dev 就点一下即可。
# ─────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      env:
        description: "手动重建的环境:dev / test / prod(按序重建该环境全部层)"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ── 路径侦测:哪些层有变更(手动触发时强制全部为 true)──
  detect:
    runs-on: ubuntu-latest
    outputs:
      network: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.network }}
      db:      ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.db }}
      gke:     ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.gke }}
      apps:    ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.f.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            network: ['01-network/**', 'envs/**/01-network.*', 'policies/**', 'opa-data/**']
            db:      ['02-core-db/**', 'envs/**/02-core-db.*', 'policies/**', 'opa-data/**']
            gke:     ['03-gke-platform/**', 'envs/**/03-gke-platform.*', 'policies/**', 'opa-data/**']
            apps:    ['04-apps/**', 'envs/**/04-apps.*']

  # ═══════════════════════════════════════════════════════════
  #  DEV 环境:push develop 自动 / workflow_dispatch(env=dev)手动重建
  # ═══════════════════════════════════════════════════════════
  dev_network:
    needs: detect
    if: |
      needs.detect.outputs.network == 'true' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'dev')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 01-network
      env: dev
      environment_name: dev
      wif_provider: ${{ vars.WIF_PROVIDER_DEV }}
      sa_email: ${{ vars.GCP_SA_EMAIL_DEV }}
    secrets: inherit

  dev_db:
    needs: [detect, dev_network]
    if: |
      always() && needs.detect.outputs.db == 'true' &&
      (needs.dev_network.result == 'success' || needs.dev_network.result == 'skipped') && (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'dev')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 02-core-db
      env: dev
      environment_name: dev
      wif_provider: ${{ vars.WIF_PROVIDER_DEV }}
      sa_email: ${{ vars.GCP_SA_EMAIL_DEV }}
    secrets: inherit

  dev_gke:
    needs: [detect, dev_db]
    if: |
      always() && needs.detect.outputs.gke == 'true' &&
      (needs.dev_db.result == 'success' || needs.dev_db.result == 'skipped') && (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'dev')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 03-gke-platform
      env: dev
      environment_name: dev
      wif_provider: ${{ vars.WIF_PROVIDER_DEV }}
      sa_email: ${{ vars.GCP_SA_EMAIL_DEV }}
    secrets: inherit

  dev_apps:
    needs: [detect, dev_gke]
    if: |
      always() && needs.detect.outputs.apps == 'true' &&
      (needs.dev_gke.result == 'success' || needs.dev_gke.result == 'skipped') && (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'dev')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 04-apps
      env: dev
      environment_name: dev
      wif_provider: ${{ vars.WIF_PROVIDER_DEV }}
      sa_email: ${{ vars.GCP_SA_EMAIL_DEV }}
    secrets: inherit

  # ═══════════════════════════════════════════════════════════
  #  TEST 环境:PR plan-only / push main 自动 / dispatch(env=test)手动
  # ═══════════════════════════════════════════════════════════
  test_network:
    needs: detect
    if: |
      needs.detect.outputs.network == 'true' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'test')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 01-network
      env: test
      environment_name: test
      wif_provider: ${{ vars.WIF_PROVIDER_TEST }}
      sa_email: ${{ vars.GCP_SA_EMAIL_TEST }}
    secrets: inherit

  test_db:
    needs: [detect, test_network]
    if: |
      always() && needs.detect.outputs.db == 'true' &&
      (needs.test_network.result == 'success' || needs.test_network.result == 'skipped') && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'test')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 02-core-db
      env: test
      environment_name: test
      wif_provider: ${{ vars.WIF_PROVIDER_TEST }}
      sa_email: ${{ vars.GCP_SA_EMAIL_TEST }}
    secrets: inherit

  test_gke:
    needs: [detect, test_db]
    if: |
      always() && needs.detect.outputs.gke == 'true' &&
      (needs.test_db.result == 'success' || needs.test_db.result == 'skipped') && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'test')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 03-gke-platform
      env: test
      environment_name: test
      wif_provider: ${{ vars.WIF_PROVIDER_TEST }}
      sa_email: ${{ vars.GCP_SA_EMAIL_TEST }}
    secrets: inherit

  test_apps:
    needs: [detect, test_gke]
    if: |
      always() && needs.detect.outputs.apps == 'true' &&
      (needs.test_gke.result == 'success' || needs.test_gke.result == 'skipped') && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'test')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 04-apps
      env: test
      environment_name: test
      wif_provider: ${{ vars.WIF_PROVIDER_TEST }}
      sa_email: ${{ vars.GCP_SA_EMAIL_TEST }}
    secrets: inherit

  # 晋升门:Test 全部层未失败,才允许进入 Prod(仅 push main / PR 晋升链需要)
  test_complete:
    needs: [test_network, test_db, test_gke, test_apps]
    if: |
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request') &&
      needs.test_network.result != 'failure' &&
      needs.test_db.result != 'failure' &&
      needs.test_gke.result != 'failure' &&
      needs.test_apps.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Test 环境全部层通过,允许晋升 Prod。"

  # ═══════════════════════════════════════════════════════════
  #  PROD 环境:push main 需 Test 通过 / dispatch(env=prod)直接重建(仍需审批)
  # ═══════════════════════════════════════════════════════════
  prod_network:
    needs: [detect, test_complete]
    if: |
      always() && needs.detect.outputs.network == 'true' && (
        (
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request') &&
          needs.test_complete.result == 'success'
        ) ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'prod')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 01-network
      env: prod
      environment_name: production-apply
      wif_provider: ${{ vars.WIF_PROVIDER_PROD }}
      sa_email: ${{ vars.GCP_SA_EMAIL_PROD }}
    secrets: inherit

  prod_db:
    needs: [detect, test_complete, prod_network]
    if: |
      always() && needs.detect.outputs.db == 'true' &&
      (needs.prod_network.result == 'success' || needs.prod_network.result == 'skipped') && (
        (
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request') &&
          needs.test_complete.result == 'success'
        ) ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'prod')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 02-core-db
      env: prod
      environment_name: production-apply
      wif_provider: ${{ vars.WIF_PROVIDER_PROD }}
      sa_email: ${{ vars.GCP_SA_EMAIL_PROD }}
    secrets: inherit

  prod_gke:
    needs: [detect, test_complete, prod_db]
    if: |
      always() && needs.detect.outputs.gke == 'true' &&
      (needs.prod_db.result == 'success' || needs.prod_db.result == 'skipped') && (
        (
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request') &&
          needs.test_complete.result == 'success'
        ) ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'prod')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 03-gke-platform
      env: prod
      environment_name: production-apply
      wif_provider: ${{ vars.WIF_PROVIDER_PROD }}
      sa_email: ${{ vars.GCP_SA_EMAIL_PROD }}
    secrets: inherit

  prod_apps:
    needs: [detect, test_complete, prod_gke]
    if: |
      always() && needs.detect.outputs.apps == 'true' &&
      (needs.prod_gke.result == 'success' || needs.prod_gke.result == 'skipped') && (
        (
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request') &&
          needs.test_complete.result == 'success'
        ) ||
        (github.event_name == 'workflow_dispatch' && inputs.env == 'prod')
      )
    uses: ./.github/workflows/_layer.yml
    with:
      layer_dir: 04-apps
      env: prod
      environment_name: production-apply
      wif_provider: ${{ vars.WIF_PROVIDER_PROD }}
      sa_email: ${{ vars.GCP_SA_EMAIL_PROD }}
    secrets: inherit
