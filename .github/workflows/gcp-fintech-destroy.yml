name: gcp-fintech-destroy

# 手动触发:Actions 页面点 "Run workflow",选择环境 + 要销毁的层 + 输入确认词。
# 依赖逆序销毁:先 04-apps → 03-gke-platform → 02-core-db → 01-network。
on:
  workflow_dispatch:
    inputs:
      env:
        description: "环境:dev / test / prod"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      layer:
        description: "销毁范围(ALL=逆序 04→03→02→01 一次删完;或选单层)"
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - 04-apps
          - 03-gke-platform
          - 02-core-db
          - 01-network
      confirm:
        description: '防误删:必须输入 DESTROY 才执行'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    # 按环境绑定审批门:dev 用 dev 环境(可无审批),test/prod 用各自审批环境
    environment: ${{ inputs.env == 'prod' && 'production-apply' || inputs.env }}
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
    steps:
      # 先 checkout,保证后续步骤有代码和目录
      - uses: actions/checkout@v4

      # 校验确认词(在仓库根目录跑,不进层目录)
      - name: 校验确认词
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "确认词错误(应为 DESTROY),已中止。输入的是:${{ inputs.confirm }}"
            exit 1
          fi
          echo "确认词通过,准备销毁 [${{ inputs.env }}] 范围=${{ inputs.layer }}"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('WIF_PROVIDER_{0}', inputs.env == 'dev' && 'DEV' || (inputs.env == 'test' && 'TEST' || 'PROD'))] }}
          service_account: ${{ vars[format('GCP_SA_EMAIL_{0}', inputs.env == 'dev' && 'DEV' || (inputs.env == 'test' && 'TEST' || 'PROD'))] }}

      - uses: hashicorp/setup-terraform@v3

      - name: 恢复 provider 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/provider.tf') }}
          restore-keys: tf-plugins-${{ runner.os }}-
      - name: 准备缓存目录
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: 按逆序销毁(init → [关删除保护] → plan-destroy → apply)
        env:
          ENVN: ${{ inputs.env }}
          LAYER: ${{ inputs.layer }}
        run: |
          set -euo pipefail
          if [ "$LAYER" = "ALL" ]; then
            LAYERS="04-apps 03-gke-platform 02-core-db 01-network"   # 逆序:先删下游
          else
            LAYERS="$LAYER"
          fi
          for L in $LAYERS; do
            echo "==================== 销毁 [$ENVN] $L ===================="
            cd "$GITHUB_WORKSPACE/$L"
            terraform init -backend-config="$GITHUB_WORKSPACE/envs/$ENVN/$L.backend.hcl"
            # 02-core-db 若开了 deletion_protection,须先关闭才能删。
            # 判断/target 都必须精确到 SQL 实例本身,不能用 "^module.postgresql":
            #   模块内的 null_resource.module_depends_on 是依赖图的根,destroy 时最后才删,
            #   一次中断的 destroy 常只剩它这一个孤儿留在 state。用前缀匹配会命中它 →
            #   误判"实例还在" → 跑 apply → 实例其实不在 → 计划 CREATE → 失败
            #   (先报 network 输出缺失,加 try() 后又报 "至少需一种 IP")。
            #   实例不在 state 时应直接跳过,交由后面的 plan -destroy 清掉孤儿。
            SQL_INSTANCE="module.postgresql.google_sql_database_instance.default"
            if [ "$L" = "02-core-db" ]; then
              if terraform state list 2>/dev/null | grep -qxF "$SQL_INSTANCE"; then
                terraform apply -auto-approve -target="$SQL_INSTANCE" \
                  -var-file="$GITHUB_WORKSPACE/envs/$ENVN/02-core-db.tfvars" \
                  -var="deletion_protection=false"
              else
                echo "02-core-db: SQL 实例不在 state,跳过关删除保护(已删除或从未部署),交由 plan -destroy 清理残留"
              fi
            fi
            # 重试:PSA(私有服务连接)在 Cloud SQL 删除后有释放延迟,
            # 首次 destroy 常报 "Producer services still using this connection"。
            # 失败则等 90s 重新 plan-destroy 再试,自动扛过传播延迟。
            ATTEMPTS=4
            for i in $(seq 1 $ATTEMPTS); do
              terraform plan -destroy -var-file="$GITHUB_WORKSPACE/envs/$ENVN/$L.tfvars" -out=destroy.tfout
              if terraform apply -auto-approve destroy.tfout; then
                echo "==================== 完成 $L ===================="
                break
              fi
              if [ "$i" -lt "$ATTEMPTS" ]; then
                echo "::warning::[$ENVN] $L 销毁第 $i 次失败(可能 PSA 释放延迟),90s 后重试..."
                sleep 90
              else
                echo "::error::[$ENVN] $L 销毁 $ATTEMPTS 次仍失败"
                exit 1
              fi
            done
          done
